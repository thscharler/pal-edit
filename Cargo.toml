[package]
name = "pal-edit"
version = "2.0.3"
edition = "2024"
authors = ["thscharler <thscharler@gmail.com>"]
description = "edit and preview for rat-theme4 color palettes."
license = "MIT/Apache-2.0"
repository = "https://github.com/thscharler/rat-salsa/pal-edit"
readme = "readme.md"
keywords = ["ratatui", "themes", "color"]
categories = ["command-line-interface"]
exclude = [".idea/*", ".gitignore"]

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
if_same_then_else = "allow"
comparison_chain = "allow"

[features]
default = []
wgpu = ["rat-salsa-switch/wgpu"]
term = ["rat-salsa-switch/term"]

[dependencies]
anyhow = "1.0"
cli-clipboard = "0.4"
dirs = "7.0"
fern = "0.7"
indexmap = "2.12"
log = "0.4"
pure-rust-locales = "0.8"
sys-locale = "0.3"
try_as_traits = { version = "0.1" }
configparser = { version = "3.1", features = ["indexmap"] }
serde_json = "1.0"

ratatui-core = { version = "0.1", features = ["std", "layout-cache"] }
ratatui-widgets = { version = "0.3", features = ["std", "unstable-rendered-line-info"] }
ratatui-crossterm = { version = "0.1" }

rat-salsa-switch = { version = "0.1", path = "../rat-salsa-switch", features = ["dialog", "dialog_widgets"], optional = true }
rat-widget = { version = "3.2", features = ["user_directories"] }
rat-widget-extra = { version = "2.1", features = ["color-input"] }
rat-theme4 = { version = "4", features = ["serde", "color-input"] }

[[bin]]
name = "paledit-wgpu"
path = "src/main.rs"
required-features = ["wgpu"]

[[bin]]
name = "paledit"
path = "src/main.rs"
required-features = ["term"]

